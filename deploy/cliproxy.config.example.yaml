# CLIProxyAPI — staging configuration template.
#
# Copy to deploy/cliproxy.config.yaml (gitignored) and fill in api-keys. deploy.ps1 ships
# that file to the box as ~/mlt-staging/deploy/cliproxy.config.yaml, and docker-compose
# bind-mounts it read-only at /CLIProxyAPI/config.yaml.
#
# THIS FILE IS MOUNTED AS A FILE, NOT A DIRECTORY. If the host path does not exist when the
# container starts, Docker helpfully creates a *directory* there and CLIProxyAPI dies with
# "failed to read config file: ... is a directory". deploy/update.sh checks for this before
# starting anything.

# The port the proxy listens on inside the container. docker-compose publishes it to
# 127.0.0.1 only — this endpoint is never exposed through Caddy.
port: 8317

# MUST be set explicitly and MUST be an absolute path.
#
# The documented default is "~/.cli-proxy-api", but under Docker the fallback does not
# apply and the container exits at startup with "failed to create auth directory : mkdir :
# no such file or directory" — an empty path, not a missing one. See
# https://github.com/router-for-me/CLIProxyAPI/issues/3272. This path is where the OAuth
# credentials live, and docker-compose mounts ./cliproxy/auth over it.
auth-dir: "/root/.cli-proxy-api"

# Callers must present one of these as a bearer token. Generate a long random value:
#
#   powershell -c "[guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')"
#
# This is what the MLT API sends as LOCAL_LLM_API_KEYS in .env, so the two must match.
# An empty list here means an unauthenticated proxy holding your provider credentials —
# published on loopback only, but still reachable by anything on the box.
api-keys:
  - "replace-me-with-a-long-random-string"

# The management API and its control panel are off. allow-remote:false binds management to
# localhost, and an empty secret-key disables the API outright. Turn it on only behind the
# SSH tunnel described in DEPLOY.md, never through Caddy.
remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true

# Keep logs on stdout so `docker compose logs cliproxy` is the single place to look, and so
# nothing grows unbounded on a 16 GB volume.
debug: false
logging-to-file: false
