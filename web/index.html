<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RAG study assistant for the IIT Madras BS Degree MLT course." />
    <title>MLT Assistant</title>
    <script>
      // Apply the stored theme before first paint, otherwise a light-mode reload
      // flashes the dark palette until React mounts. Key must match
      // THEME_STORAGE_KEY in src/theme/theme-context.js.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
